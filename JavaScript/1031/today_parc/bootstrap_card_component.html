<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>

    <div>
      <button type="button" id="change-btn">Chang Image!</button>
    </div>
    <div class="container"></div>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      // https://dog.ceo/api/breeds/image/random
      //
      async function makeCards(c, r) {
        const container = document.querySelector('.container');
        for (let i = 0; i < c; i++) {
          const row = document.createElement('div');
          row.classList.add('row');
          for (let j = 0; j < r; j++) {
            const card = await getCard(r);
            row.insertAdjacentHTML('beforeend', card);
          }
          container.append(row);
        }
      }
      async function getImg() {
        const response = await fetch('https://dog.ceo/api/breeds/image/random');
        const data = await response.json();
        return data.message;
      }
      async function getCard(rowSize) {
        const card = `
        <div class="card col-md-${Math.floor(12 / rowSize)}">
          <img src="${await getImg()}" class="card-img-top" alt="dog img" height="40%"/>
          <div class="card-body">
            <h5 class="card-title">Card title</h5>
            <p class="card-text">
              Some quick example text to build on the card title and make up the
              bulk of the card's content.
            </p>
            <a href="#" class="btn btn-primary">Go somewhere</a>
          </div>
        </div>
        `;
        return card;
      }
      makeCards(3, 3);
      const changeBtn = document.querySelector('#change-btn');
      changeBtn.addEventListener('click',  () => {
        const imeges = document.querySelectorAll('.card > img');
        imeges.forEach(async img => {img.src = await getImg()})
      });


</script>
  </body>
</html>
