<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        border: 1px solid #ddd;
        padding: 10px;
        margin: 10px;
        width: 200px;
      }

      .card-title {
        font-weight: bold;
      }

      .card-body {
        color: #666;
      }
    </style>
  </head>

  <body>
    <!-- Services 항목을 추가하시오. -->
    <ul id="menu">
      <li>Home</li>
      <li>About</li>
    </ul>
    <script>
      // 1. li 만들고
      // 2. li의 text를 Services 넣고
      // 3. menu 선택
      // 4. li를 menu에 넣기
      const li = document.createElement('li');
      li.textContent = 'Services';
      const menu_1 = document.querySelector('#menu');
      menu_1.append(li);
    </script>
    <!-- 아래 배열의 각 항목을 메뉴에 추가하세요 -->
    <ul id="menu-2">
      <li>Home</li>
      <li>About</li>
    </ul>
    <script>
      const menu_2 = document.querySelector('#menu-2');
      const newItems = ['Services', 'Products', 'Contact'];
      let idx = 1
      newItems.forEach((el) => {
        const newLi = document.createElement('li');
        newLi.textContent = el;
        setTimeout(() => {
          menu_2.append(newLi);
        }, 1000 * idx++ );
      });

    </script>

    <!-- 아래 데이터를 사용해서 container 안에 카드 형태의 요소들을 생성하세요 -->
    <div id="cardContainer"></div>

    <script>
      const cards = [
        { title: '카드1', content: '내용1', color: '#ffeeee' },
        { title: '카드2', content: '내용2', color: '#eeffee' },
        { title: '카드3', content: '내용2', color: '#eeeeff' },
      ];
      const container = document.querySelector('#cardContainer');
      cards.forEach((el) => {
        // 부모
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.style.backgroundColor = el['color'];
        // 자식 1
        const titleDiv = document.createElement('div');
        titleDiv.textContent = el['content'];
        titleDiv.className = 'card-title';
        // 자식 2
        const contentDiv = document.createElement('div');
        contentDiv.textContent = el['title'];
        contentDiv.className = 'card-body';
        setTimeout(() => {
          cardDiv.append(titleDiv, contentDiv);
          container.append(cardDiv);
        }, 1000 * idx++);
      });
      // 각 카드는 다음 구조를 가져야 합니다:
      // <div class="card" style="background-color: #색상">
      //   <div class="card-title">제목</div>
      //   <div class="card-body">내용</div>
      // </div>
    </script>
  </body>
</html>
